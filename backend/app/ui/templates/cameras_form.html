<form id="cameras-form" hx-post="/cameras" hx-target="#cameras-form" hx-swap="outerHTML">
  {% if message %}<p class="msg" data-kind="{{ message_kind }}" role="status">{{ message }}</p>{% endif %}
  <table>
    <thead><tr><th>Enabled</th><th>ID</th><th>Name</th><th>Source</th><th></th></tr></thead>
    <tbody>
      {% for cam in rows %}
      <tr>
        <td><input type="checkbox" name="enabled" value="{{ loop.index0 }}" {% if cam.enabled %}checked{% endif %}></td>
        <td><input name="id" value="{{ cam.id }}" required pattern="[\w\-]+" aria-label="Camera id"></td>
        <td><input name="name" value="{{ cam.name }}" required aria-label="Camera name"></td>
        <td><input name="source" value="{{ cam.source }}" required aria-label="Camera source"></td>
        <td><button type="button" class="outline secondary"
              hx-post="/cameras/remove-row?index={{ loop.index0 }}" hx-include="#cameras-form"
              hx-target="#cameras-form" hx-swap="outerHTML">Remove</button></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="grid">
    <button type="button" class="outline" hx-post="/cameras/add-row" hx-include="#cameras-form"
            hx-target="#cameras-form" hx-swap="outerHTML">Add camera</button>
    <button type="submit">Save cameras</button>
  </div>
</form>
