venue:
  name: Demo Venue
  moments_server_url: http://localhost:8080/health
recording:
  ffmpeg_path: ffmpeg
  width: 1280
  height: 720
  fps: 25
  format: mp4
  video_codec: libx264
  encoder_args:
  - -preset
  - veryfast
  - -crf
  - '23'
  ride_duration_seconds: null
  max_duration_seconds: 600
  open_timeout_seconds: 5
  disconnect_timeout_seconds: 5
trigger:
  debounce_seconds: 0.5
storage:
  sessions_dir: storage/sessions
  disk_warn_gb: 5
cameras:
- id: camera_1
  name: Arena Front
  source: 0
- id: camera_2
  name: Arena Rear
  source: 1
